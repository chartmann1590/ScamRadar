name: Publish to Google Play

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      confirm_play_publish:
        description: 'Type "publish" to confirm submission to Google Play'
        required: true
        type: string
      track:
        description: 'Play Console track (internal = instant, no setup; alpha = closed testing default track, must exist in Console first; production = public release)'
        required: true
        type: choice
        options:
          - internal
          - alpha
          - production
        default: internal
      release_notes:
        description: 'Release notes (leave empty to auto-generate from commits)'
        required: false
        type: string
        default: ''

jobs:
  publish:
    name: Build and Publish to Google Play
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Confirm publish input
        run: |
          if [ "${{ github.event.inputs.confirm_play_publish }}" != "publish" ]; then
            echo "::error::confirm_play_publish must be exactly 'publish' to proceed. Got: '${{ github.event.inputs.confirm_play_publish }}'"
            exit 1
          fi
          echo "Publish confirmed. Proceeding with Play release to track: ${{ github.event.inputs.track }}"

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/gradle-build-action@12318b01111bfa6462c00534ffa998f8b397b979 # v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode google-services.json
        run: printf '%s' "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > app/google-services.json

      - name: Decode release keystore
        run: printf '%s' "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/release.keystore

      - name: Compute Play version values
        id: versions
        run: |
          echo "ANDROID_VERSION_CODE=$(date -u +'%y%j%H%M')" >> $GITHUB_ENV
          echo "ANDROID_VERSION_NAME=1.0.$(date -u +'%Y%m%d.%H%M')" >> $GITHUB_ENV

      - name: Generate release notes
        id: notes
        env:
          INPUT_NOTES: ${{ github.event.inputs.release_notes }}
        run: |
          mkdir -p distribution/whatsnew
          if [ -n "$INPUT_NOTES" ]; then
            echo "$INPUT_NOTES" > distribution/whatsnew/whatsnew-en-US
          else
            TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
            if [ -n "$TAG" ]; then
              git log --pretty=format:"- %s" "$TAG..HEAD" > distribution/whatsnew/whatsnew-en-US
            elif [ -f app/src/main/play/listings/whats_new.txt ]; then
              cp app/src/main/play/listings/whats_new.txt distribution/whatsnew/whatsnew-en-US
            else
              echo "Bug fixes and performance improvements." > distribution/whatsnew/whatsnew-en-US
            fi
          fi
          echo "Release notes:"
          cat distribution/whatsnew/whatsnew-en-US

      - name: Run unit tests
        run: ./gradlew test

      - name: Run lint
        run: ./gradlew lint

      - name: Build Play release AAB
        env:
          KEYSTORE_FILE: release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ADMOB_BANNER_ID: ${{ secrets.ADMOB_BANNER_ID }}
          ADMOB_INTERSTITIAL_ID: ${{ secrets.ADMOB_INTERSTITIAL_ID }}
          ADMOB_NATIVE_ID: ${{ secrets.ADMOB_NATIVE_ID }}
        run: ./gradlew bundleRelease

      - name: Upload AAB as artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scamradar-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Verify service account key
        env:
          KEY_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$KEY_JSON" ]; then
            echo "::error::GOOGLE_PLAY_SERVICE_ACCOUNT_JSON secret is empty or missing"
            exit 1
          fi
          echo "Service account key is present."

      - name: Publish to Google Play
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.charles.scamradar.app
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          track: ${{ github.event.inputs.track }}
          status: completed
          whatsNewDirectory: distribution/whatsnew
          mappingFile: app/build/outputs/mapping/release/mapping.txt
